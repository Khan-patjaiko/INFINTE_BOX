# Supabase free-plan projects pause after 7 days without database activity
# (it happened 2026-10-04). A tiny read every 3 days keeps the store's backend awake.
# Uses the public anon key from site/assets/js/config.js — no secrets needed.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one product
        run: |
          curl --fail-with-body -sS \
            -H "apikey: sb_publishable_-98ePc2X1ejc_YscwxuYtw_W_7p4lVq" \
            "https://ptwfidmlnuggxvqhimhe.supabase.co/rest/v1/products?select=id&limit=1"
