<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Infinite Box</title>
<meta name="description" content="Choose a new password for your Infinite Box account.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/icon-dark.png">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div id="header-placeholder"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <p class="eyebrow">Account</p>
      <h1>Choose a new password</h1>
      <p>Use at least 8 characters with a mix of uppercase, lowercase, numbers and symbols.</p>
    </div>
  </section>

  <section class="section" style="padding-top:48px;">
    <div class="container">
      <div class="auth-wrap">
        <p class="grid-status" id="reset-checking">Checking your link…</p>

        <div id="reset-invalid" style="display:none;">
          <p class="form-note" style="color:hsl(var(--destructive));">This reset link is invalid or has expired.</p>
          <a class="btn btn-primary btn-block" href="forgot-password.html" style="margin-top:16px;">Request a new link</a>
          <p class="auth-alt"><a href="login.html">Back to log in</a></p>
        </div>

        <form class="form-grid" id="reset-form" style="display:none;" onsubmit="return handleReset(event)">
          <div class="field">
            <label for="password">New password</label>
            <input type="password" id="password" required minlength="8" autocomplete="new-password">
          </div>
          <div class="field">
            <label for="password2">Confirm new password</label>
            <input type="password" id="password2" required minlength="8" autocomplete="new-password">
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="reset-submit">Save new password</button>
          <p class="form-note" id="reset-error" style="display:none;color:hsl(var(--destructive));"></p>
        </form>
      </div>
    </div>
  </section>
</main>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/partials.js"></script>
<script>
  (function () {
    var shown = false;
    function show(id) {
      if (shown) return;
      shown = true;
      document.getElementById("reset-checking").style.display = "none";
      document.getElementById(id).style.display = id === "reset-form" ? "grid" : "block";
    }

    // The recovery link arrives with tokens in the URL hash; supabase-js turns them into a
    // session and fires PASSWORD_RECOVERY. A normal signed-in user (from account.html
    // "Change password") already has a session. Anything else → invalid.
    document.addEventListener("DOMContentLoaded", function () {
      if (!window.IBDB) return show("reset-invalid");
      IBDB.auth.onAuthStateChange(function (event, session) {
        if (session && (event === "PASSWORD_RECOVERY" || event === "SIGNED_IN" || event === "INITIAL_SESSION")) show("reset-form");
      });
      IBDB.auth.getSession().then(function (res) {
        if (res && res.data && res.data.session) show("reset-form");
      });
      setTimeout(function () { show("reset-invalid"); }, 2500);
    });

    window.handleReset = async function (e) {
      e.preventDefault();
      var btn = document.getElementById("reset-submit");
      var errEl = document.getElementById("reset-error");
      var pw = document.getElementById("password").value;
      var pw2 = document.getElementById("password2").value;
      errEl.style.display = "none";
      if (pw !== pw2) {
        errEl.textContent = "Those passwords don't match.";
        errEl.style.display = "block";
        return false;
      }
      btn.disabled = true;
      btn.textContent = "Saving…";
      try {
        var res = await IBAuth.updatePassword(pw);
        if (res.error) throw res.error;
        // Drop the recovery tokens from the URL before moving on.
        history.replaceState(null, "", location.pathname);
        window.location.href = "account.html";
      } catch (err) {
        errEl.textContent = err && err.message ? err.message : "Couldn't save the new password. Please try again.";
        errEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Save new password";
      }
      return false;
    };
  })();
</script>
</body>
</html>
