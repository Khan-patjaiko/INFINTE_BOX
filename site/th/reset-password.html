<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตั้งรหัสผ่านใหม่ — Infinite Box</title>
<meta name="description" content="ตั้งรหัสผ่านใหม่สำหรับบัญชี Infinite Box">
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/img/icon-dark.png">
<link rel="stylesheet" href="../assets/css/styles.css?v=19">
</head>
<body>

<div id="header-placeholder"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <p class="eyebrow">บัญชีของฉัน</p>
      <h1>ตั้งรหัสผ่านใหม่</h1>
      <p>ตั้งรหัสผ่านที่คาดเดายาก — รายการด้านล่างจะอัปเดตขณะพิมพ์</p>
    </div>
  </section>

  <section class="section" style="padding-top:48px;">
    <div class="container">
      <div class="auth-wrap">
        <p class="grid-status" id="reset-checking">กำลังตรวจสอบลิงก์…</p>

        <div id="reset-invalid" style="display:none;">
          <p class="form-note" style="color:hsl(var(--destructive));">ลิงก์นี้ไม่ถูกต้องหรือหมดอายุแล้ว</p>
          <a class="btn btn-primary btn-block" href="forgot-password.html" style="margin-top:16px;">ขอลิงก์ใหม่</a>
          <p class="auth-alt"><a href="login.html">กลับไปหน้าเข้าสู่ระบบ</a></p>
        </div>

        <form class="form-grid" id="reset-form" style="display:none;" onsubmit="return handleReset(event)">
          <div class="field">
            <label for="password">รหัสผ่านใหม่</label>
            <input type="password" id="password" required minlength="8" maxlength="50" autocomplete="new-password" aria-describedby="password-rules">
          </div>
          <div class="field">
            <label for="password2">ยืนยันรหัสผ่านใหม่</label>
            <input type="password" id="password2" required minlength="8" maxlength="50" autocomplete="new-password">
            <p class="form-note" id="password-match" style="display:none;color:hsl(var(--destructive));" role="alert">รหัสผ่านไม่ตรงกัน</p>
          </div>
          <div class="pw-rules" id="password-rules" aria-live="polite"></div>
          <button class="btn btn-primary btn-block" type="submit" id="reset-submit" disabled>บันทึกรหัสผ่านใหม่</button>
          <p class="form-note" id="reset-error" style="display:none;color:hsl(var(--destructive));"></p>
        </form>
      </div>
    </div>
  </section>
</main>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script src="../assets/js/i18n-th.js?v=19"></script>
<script src="../assets/js/i18n.js?v=19"></script>
<script src="../assets/js/config.js?v=19"></script>
<script src="../assets/js/supabase-client.js?v=19"></script>
<script src="../assets/js/products.js?v=19"></script>
<script src="../assets/js/main.js?v=19"></script>
<script src="../assets/js/auth.js?v=19"></script>
<script src="../assets/js/partials.js?v=19"></script>
<script>
  (function () {
    var shown = false;
    function show(id) {
      if (shown) return;
      shown = true;
      document.getElementById("reset-checking").style.display = "none";
      document.getElementById(id).style.display = id === "reset-form" ? "grid" : "block";
    }

    // The recovery link arrives with tokens in the URL hash; supabase-js turns them into a
    // session and fires PASSWORD_RECOVERY. A normal signed-in user (from account.html
    // "Change password") already has a session. Anything else → invalid.
    document.addEventListener("DOMContentLoaded", function () {
      IBAuth.attachPasswordRules({ password: "password", confirm: "password2", list: "password-rules", submit: "reset-submit", matchError: "password-match" });
      if (!window.IBDB) return show("reset-invalid");
      IBDB.auth.onAuthStateChange(function (event, session) {
        if (session && (event === "PASSWORD_RECOVERY" || event === "SIGNED_IN" || event === "INITIAL_SESSION")) show("reset-form");
      });
      IBDB.auth.getSession().then(function (res) {
        if (res && res.data && res.data.session) show("reset-form");
      });
      setTimeout(function () { show("reset-invalid"); }, 2500);
    });

    window.handleReset = async function (e) {
      e.preventDefault();
      var btn = document.getElementById("reset-submit");
      var errEl = document.getElementById("reset-error");
      var pw = document.getElementById("password").value;
      var pw2 = document.getElementById("password2").value;
      errEl.style.display = "none";
      if (pw !== pw2 || !IBAuth.passwordIsValid(pw)) {
        errEl.textContent = pw !== pw2 ? ibT("Those passwords don't match.") : ibT("Your password doesn't meet all the conditions yet.");
        errEl.style.display = "block";
        return false;
      }
      btn.disabled = true;
      btn.textContent = ibT("Saving…");
      try {
        var res = await IBAuth.updatePassword(pw);
        if (res.error) throw res.error;
        // Drop the recovery tokens from the URL before moving on.
        history.replaceState(null, "", location.pathname);
        window.location.href = "account.html";
      } catch (err) {
        errEl.textContent = err && err.message ? ibT(err.message) : ibT("Couldn't save the new password. Please try again.");
        errEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = ibT("Save new password");
      }
      return false;
    };
  })();
</script>
</body>
</html>
