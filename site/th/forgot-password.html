<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ลืมรหัสผ่าน — Infinite Box</title>
<meta name="description" content="ขอลิงก์ตั้งรหัสผ่านใหม่สำหรับบัญชี Infinite Box">
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/img/icon-dark.png">
<link rel="stylesheet" href="../assets/css/styles.css?v=19">
</head>
<body>

<div id="header-placeholder"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <p class="eyebrow">บัญชีของฉัน</p>
      <h1>ลืมรหัสผ่าน?</h1>
      <p>กรอกอีเมลของคุณ แล้วเราจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ให้</p>
    </div>
  </section>

  <section class="section" style="padding-top:48px;">
    <div class="container">
      <div class="auth-wrap">
        <form class="form-grid" id="forgot-form" onsubmit="return handleForgot(event)">
          <div class="field">
            <label for="email">อีเมล</label>
            <input type="email" id="email" required autocomplete="email">
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="forgot-submit">ส่งลิงก์ตั้งรหัสผ่านใหม่</button>
          <p class="form-note" id="forgot-success" style="display:none;color:hsl(var(--success));">หากอีเมลนี้มีบัญชีอยู่ เราได้ส่งลิงก์ตั้งรหัสผ่านใหม่ไปแล้ว กรุณาตรวจสอบกล่องจดหมาย (และโฟลเดอร์สแปม)</p>
          <p class="form-note" id="forgot-error" style="display:none;color:hsl(var(--destructive));"></p>
        </form>
        <p class="auth-alt">นึกออกแล้ว? <a href="login.html">กลับไปหน้าเข้าสู่ระบบ</a></p>
      </div>
    </div>
  </section>
</main>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script src="../assets/js/i18n-th.js?v=19"></script>
<script src="../assets/js/i18n.js?v=19"></script>
<script src="../assets/js/config.js?v=19"></script>
<script src="../assets/js/supabase-client.js?v=19"></script>
<script src="../assets/js/products.js?v=19"></script>
<script src="../assets/js/main.js?v=19"></script>
<script src="../assets/js/auth.js?v=19"></script>
<script src="../assets/js/partials.js?v=19"></script>
<script>
  async function handleForgot(e) {
    e.preventDefault();
    var btn = document.getElementById("forgot-submit");
    var okEl = document.getElementById("forgot-success");
    var errEl = document.getElementById("forgot-error");
    okEl.style.display = "none";
    errEl.style.display = "none";
    btn.disabled = true;
    btn.textContent = ibT("Sending…");
    try {
      var res = await IBAuth.resetPassword(document.getElementById("email").value.trim());
      // Rate-limit / network errors are worth showing; "user not found" is deliberately
      // not distinguished so the form can't be used to probe which emails have accounts.
      if (res.error && /rate|limit|network|fetch/i.test(res.error.message || "")) throw res.error;
      okEl.style.display = "block";
      document.getElementById("forgot-form").reset();
    } catch (err) {
      errEl.textContent = err && err.message ? ibT(err.message) : ibT("Couldn't send the reset link. Please try again.");
      errEl.style.display = "block";
    } finally {
      btn.disabled = false;
      btn.textContent = ibT("Send reset link");
    }
    return false;
  }
</script>
</body>
</html>
