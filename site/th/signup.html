<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมัครสมาชิก — Infinite Box</title>
<meta name="description" content="สมัครบัญชี Infinite Box เพื่อติดตามคำสั่งซื้อและใบเสนอราคา">
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/img/icon-dark.png">
<link rel="stylesheet" href="../assets/css/styles.css?v=19">
</head>
<body>

<div id="header-placeholder"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <p class="eyebrow">บัญชีของฉัน</p>
      <h1>สมัครสมาชิก</h1>
      <p>สมัครบัญชีเพื่อชำระเงินได้เร็วขึ้น และติดตามคำสั่งซื้อและใบเสนอราคาของคุณ</p>
    </div>
  </section>

  <section class="section" style="padding-top:48px;">
    <div class="container">
      <div class="auth-wrap">
        <button type="button" class="btn-google" id="google-signup-btn" onclick="handleGoogleSignup()">
          <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.03l3.05-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.97l3.05 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
          <span>ดำเนินการต่อด้วย Google</span>
        </button>
        <div class="auth-divider"><span>หรือ</span></div>
        <form class="form-grid" id="signup-form" onsubmit="return handleSignup(event)">
          <div class="field">
            <label for="full_name">ชื่อ-นามสกุล</label>
            <input type="text" id="full_name" autocomplete="name">
          </div>
          <div class="field">
            <label for="email">อีเมล</label>
            <input type="email" id="email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="password">รหัสผ่าน</label>
            <input type="password" id="password" required minlength="8" maxlength="50" autocomplete="new-password" aria-describedby="password-rules">
          </div>
          <div class="field">
            <label for="password2">ยืนยันรหัสผ่าน</label>
            <input type="password" id="password2" required minlength="8" maxlength="50" autocomplete="new-password">
            <p class="form-note" id="password-match" style="display:none;color:hsl(var(--destructive));" role="alert">รหัสผ่านไม่ตรงกัน</p>
          </div>
          <div class="pw-rules" id="password-rules" aria-live="polite"></div>
          <button class="btn btn-primary btn-block" type="submit" id="signup-submit" disabled>สมัครสมาชิก</button>
          <p class="form-note">การสมัครสมาชิกถือว่าคุณยอมรับ <a href="terms.html">ข้อกำหนดการให้บริการ</a> และ <a href="privacy.html">นโยบายความเป็นส่วนตัว</a>.</p>
          <p class="form-note" id="signup-success" style="display:none;color:hsl(var(--success));"></p>
          <p class="form-note" id="signup-error" style="display:none;color:hsl(var(--destructive));"></p>
        </form>
        <p class="auth-alt">มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a></p>
      </div>
    </div>
  </section>
</main>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script src="../assets/js/i18n-th.js?v=19"></script>
<script src="../assets/js/i18n.js?v=19"></script>
<script src="../assets/js/config.js?v=19"></script>
<script src="../assets/js/supabase-client.js?v=19"></script>
<script src="../assets/js/products.js?v=19"></script>
<script src="../assets/js/main.js?v=19"></script>
<script src="../assets/js/auth.js?v=19"></script>
<script src="../assets/js/partials.js?v=19"></script>
<script>
  // Same-site pages only (e.g. "cart.html" when sent here from checkout) — never absolute/../ URLs.
  function nextTarget() {
    var next = new URLSearchParams(location.search).get("next");
    return (next && /^(admin\/)?[a-zA-Z0-9_-]+\.html$/.test(next)) ? (next.indexOf("admin/") === 0 ? IBI18n.root + next : next) : "account.html"; // admin lives at the root, also from /th/
  }

  IBAuth.getUser().then(function (user) { if (user) window.location.href = nextTarget(); });

  IBAuth.attachPasswordRules({ password: "password", confirm: "password2", list: "password-rules", submit: "signup-submit", matchError: "password-match" });

  async function handleGoogleSignup() {
    var btn = document.getElementById("google-signup-btn");
    var errorEl = document.getElementById("signup-error");
    errorEl.style.display = "none";
    btn.disabled = true;
    try {
      var res = await IBAuth.signInWithGoogle(nextTarget());
      if (res.error) throw res.error;
    } catch (err) {
      errorEl.textContent = err && err.message ? ibT(err.message) : ibT("Google sign-in failed. Please try again.");
      errorEl.style.display = "block";
      btn.disabled = false;
    }
  }

  async function handleSignup(e) {
    e.preventDefault();
    var btn = document.getElementById("signup-submit");
    var successEl = document.getElementById("signup-success");
    var errorEl = document.getElementById("signup-error");
    var pw = document.getElementById("password"), pw2 = document.getElementById("password2");
    if (!IBAuth.passwordIsValid(pw.value) || pw.value !== pw2.value) { pw.dispatchEvent(new Event("input")); return false; }
    successEl.style.display = "none";
    errorEl.style.display = "none";
    btn.disabled = true;
    btn.textContent = ibT("Creating…");
    try {
      var res = await IBAuth.signUp(
        document.getElementById("email").value,
        document.getElementById("password").value,
        document.getElementById("full_name").value
      );
      if (res.error) throw res.error;
      if (res.data && res.data.session) {
        // Auto-confirmed: already logged in.
        window.location.href = nextTarget();
        return false;
      }
      // Email confirmation required.
      document.getElementById("signup-form").reset();
      successEl.textContent = nextTarget() === "cart.html"
        ? ibT("Almost there — check your email to confirm your account, then log in to finish your order (your cart is saved on this device).")
        : ibT("Almost there — check your email to confirm your account, then log in.");
      successEl.style.display = "block";
    } catch (err) {
      errorEl.textContent = err && err.message ? ibT(err.message) : ibT("Couldn't create your account. Please try again.");
      errorEl.style.display = "block";
    } finally {
      pw.dispatchEvent(new Event("input")); // re-checks rules; leaves the button disabled after a reset
      btn.textContent = ibT("Create account");
    }
    return false;
  }
</script>
</body>
</html>
