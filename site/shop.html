<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — Infinite Box</title>
<meta name="description" content="Browse ready-to-ship 3D printed parts from Infinite Box: enclosures, brackets, gears, resin details, and accessories.">
<link rel="canonical" href="https://infinite-box.co/shop.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Infinite Box">
<meta property="og:title" content="Shop — Infinite Box">
<meta property="og:description" content="Browse ready-to-ship 3D printed parts from Infinite Box: enclosures, brackets, gears, resin details, and accessories.">
<meta property="og:url" content="https://infinite-box.co/shop.html">
<meta property="og:image" content="https://infinite-box.co/assets/img/logo-dark.png">
<meta name="twitter:card" content="summary">
<link rel="icon" href="assets/img/icon-dark.png">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div id="header-placeholder"></div>

<main>
  <section class="page-hero shop-hero">
    <div class="container">
      <p class="eyebrow">Catalogue</p>
      <h1>Shop</h1>
      <p>Ready-to-ship parts, printed on demand. Pick a category, or send us a custom design for a quote.</p>
      <div class="filter-bar" id="filter-bar" aria-label="Product categories"></div>
    </div>
  </section>

  <section class="section shop-section">
    <div class="container">
      <div class="product-grid" id="shop-product-grid"></div>
    </div>
  </section>
</main>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/partials.js"></script>
<script>
  (function () {
    var filterBar = document.getElementById("filter-bar");
    var grid = document.getElementById("shop-product-grid");

    function renderGrid(category) {
      var items = category === "All" ? PRODUCTS : PRODUCTS.filter(function (p) { return p.category === category; });
      grid.innerHTML = items.length
        ? items.map(productCardHTML).join("")
        : '<p class="grid-status">Nothing in this category yet — <a href="custom.html">request a custom part</a> and we will print it.</p>';
    }

    filterBar.addEventListener("click", function (e) {
      var btn = e.target.closest(".filter-chip");
      if (!btn) return;
      filterBar.querySelectorAll(".filter-chip").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      renderGrid(btn.dataset.category);
    });

    function load() {
      grid.innerHTML = '<p class="grid-status">Loading products…</p>';
      Promise.all([loadProducts(), loadCategories()]).then(function (r) {
        // Every configured category is shown so customers can see the range; any category
        // only present on a product is appended.
        var ordered = r[1].slice();
        PRODUCTS.forEach(function (p) { if (p.category && ordered.indexOf(p.category) === -1) ordered.push(p.category); });
        var categories = ["All"].concat(ordered);
        filterBar.innerHTML = categories.map(function (c, i) {
          return '<button class="filter-chip' + (i === 0 ? ' active' : '') + '" data-category="' + ibEscape(c) + '">' + ibEscape(c) + '</button>';
        }).join("");

        renderGrid("All");
      }).catch(function () {
        grid.innerHTML = loadErrorHTML("Couldn't load products.");
      });
    }
    ibOnRetry(grid, load);
    load();
  })();
</script>
</body>
</html>
