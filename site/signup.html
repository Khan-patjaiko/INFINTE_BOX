<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — Infinite Box</title>
<meta name="description" content="Create an Infinite Box account to track orders and custom quotes.">
<link rel="icon" href="assets/img/icon-dark.png">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div id="header-placeholder"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <p class="eyebrow">Account</p>
      <h1>Create account</h1>
      <p>Set up an account to check out faster and track your orders and quotes.</p>
    </div>
  </section>

  <section class="section" style="padding-top:48px;">
    <div class="container">
      <div class="auth-wrap">
        <button type="button" class="btn-google" id="google-signup-btn" onclick="handleGoogleSignup()">
          <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.03l3.05-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.97l3.05 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
          <span>Continue with Google</span>
        </button>
        <div class="auth-divider"><span>or</span></div>
        <form class="form-grid" id="signup-form" onsubmit="return handleSignup(event)">
          <div class="field">
            <label for="full_name">Full name</label>
            <input type="text" id="full_name" autocomplete="name">
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" required minlength="6" autocomplete="new-password">
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="signup-submit">Create account</button>
          <p class="form-note" id="signup-success" style="display:none;color:hsl(var(--success));"></p>
          <p class="form-note" id="signup-error" style="display:none;color:hsl(var(--destructive));"></p>
        </form>
        <p class="auth-alt">Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </section>
</main>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/partials.js"></script>
<script>
  IBAuth.getUser().then(function (user) { if (user) window.location.href = "account.html"; });

  async function handleGoogleSignup() {
    var btn = document.getElementById("google-signup-btn");
    var errorEl = document.getElementById("signup-error");
    errorEl.style.display = "none";
    btn.disabled = true;
    try {
      var res = await IBAuth.signInWithGoogle("account.html");
      if (res.error) throw res.error;
    } catch (err) {
      errorEl.textContent = err && err.message ? err.message : "Google sign-in failed. Please try again.";
      errorEl.style.display = "block";
      btn.disabled = false;
    }
  }

  async function handleSignup(e) {
    e.preventDefault();
    var btn = document.getElementById("signup-submit");
    var successEl = document.getElementById("signup-success");
    var errorEl = document.getElementById("signup-error");
    successEl.style.display = "none";
    errorEl.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Creating…";
    try {
      var res = await IBAuth.signUp(
        document.getElementById("email").value,
        document.getElementById("password").value,
        document.getElementById("full_name").value
      );
      if (res.error) throw res.error;
      if (res.data && res.data.session) {
        // Auto-confirmed: already logged in.
        window.location.href = "account.html";
        return false;
      }
      // Email confirmation required.
      document.getElementById("signup-form").reset();
      successEl.textContent = "Almost there — check your email to confirm your account, then log in.";
      successEl.style.display = "block";
    } catch (err) {
      errorEl.textContent = err && err.message ? err.message : "Couldn't create your account. Please try again.";
      errorEl.style.display = "block";
    } finally {
      btn.disabled = false;
      btn.textContent = "Create account";
    }
    return false;
  }
</script>
</body>
</html>
