<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password — Infinite Box</title>
<meta name="description" content="Request a password reset link for your Infinite Box account.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/icon-dark.png">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div id="header-placeholder"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <p class="eyebrow">Account</p>
      <h1>Forgot your password?</h1>
      <p>Enter your email and we'll send you a link to choose a new one.</p>
    </div>
  </section>

  <section class="section" style="padding-top:48px;">
    <div class="container">
      <div class="auth-wrap">
        <form class="form-grid" id="forgot-form" onsubmit="return handleForgot(event)">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="email">
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="forgot-submit">Send reset link</button>
          <p class="form-note" id="forgot-success" style="display:none;color:hsl(var(--success));">If an account exists for that email, a reset link is on its way. Check your inbox (and spam folder).</p>
          <p class="form-note" id="forgot-error" style="display:none;color:hsl(var(--destructive));"></p>
        </form>
        <p class="auth-alt">Remembered it? <a href="login.html">Back to log in</a></p>
      </div>
    </div>
  </section>
</main>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/partials.js"></script>
<script>
  async function handleForgot(e) {
    e.preventDefault();
    var btn = document.getElementById("forgot-submit");
    var okEl = document.getElementById("forgot-success");
    var errEl = document.getElementById("forgot-error");
    okEl.style.display = "none";
    errEl.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Sending…";
    try {
      var res = await IBAuth.resetPassword(document.getElementById("email").value.trim());
      // Rate-limit / network errors are worth showing; "user not found" is deliberately
      // not distinguished so the form can't be used to probe which emails have accounts.
      if (res.error && /rate|limit|network|fetch/i.test(res.error.message || "")) throw res.error;
      okEl.style.display = "block";
      document.getElementById("forgot-form").reset();
    } catch (err) {
      errEl.textContent = err && err.message ? err.message : "Couldn't send the reset link. Please try again.";
      errEl.style.display = "block";
    } finally {
      btn.disabled = false;
      btn.textContent = "Send reset link";
    }
    return false;
  }
</script>
</body>
</html>
