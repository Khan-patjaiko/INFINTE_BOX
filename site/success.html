<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order confirmed — Infinite Box</title>
<meta name="description" content="Your Infinite Box order has been placed.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/icon-dark.png">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div id="header-placeholder"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <p class="eyebrow">Thank you</p>
      <h1>Order confirmed</h1>
      <p>Your payment went through and your order is in our queue. We've emailed your receipt — most orders print and ship within 3–5 business days.</p>
      <div class="btn-row" style="margin-top:32px;">
        <a class="btn btn-outline" href="#" id="my-order-link" style="display:none;">My order</a>
        <a class="btn btn-primary" href="shop.html">Continue shopping</a>
      </div>
    </div>
  </section>
</main>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/partials.js"></script>
<script>
  // The order succeeded — clear the local cart.
  try { localStorage.removeItem("infinitebox_cart"); } catch (e) {}
  if (window.IB) IB.updateCartBadge();

  // Stripe redirects here with ?session_id=... — use it to link straight to
  // this order's status page (works for guests and signed-in customers alike).
  var sessionId = new URLSearchParams(location.search).get("session_id");
  if (sessionId) {
    var link = document.getElementById("my-order-link");
    if (link) {
      link.href = "order.html?session_id=" + encodeURIComponent(sessionId);
      link.style.display = "";
    }
  }
</script>
</body>
</html>
