<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Product — Infinite Box</title>
<meta name="description" content="Product details, specifications and pricing for 3D printed parts from Infinite Box.">
<link rel="canonical" href="https://infinite-box.co/product.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Infinite Box">
<meta property="og:title" content="Product — Infinite Box">
<meta property="og:description" content="Product details, specifications and pricing for 3D printed parts from Infinite Box.">
<meta property="og:url" content="https://infinite-box.co/product.html">
<meta property="og:image" content="https://infinite-box.co/assets/img/logo-dark.png">
<meta name="twitter:card" content="summary">
<link rel="icon" href="assets/img/icon-dark.png">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div id="header-placeholder"></div>

<main>
  <div class="container">
    <div class="product-detail" id="product-detail"></div>
  </div>

  <section class="section border-top">
    <div class="container">
      <div class="section-head">
        <div><p class="eyebrow">You might also like</p><h2>More products</h2></div>
      </div>
      <div class="product-grid" id="related-grid"></div>
    </div>
  </section>
</main>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/partials.js"></script>
<script>
  (function () {
    var detail = document.getElementById("product-detail");

    function load() {
      detail.innerHTML = '<p class="grid-status">Loading…</p>';
      loadProducts().then(function () {
        if (!PRODUCTS.length) {
          detail.innerHTML = '<p class="grid-status">No products available yet — <a href="custom.html">request a custom part</a> instead.</p>';
          return;
        }
        var params = new URLSearchParams(location.search);
        var id = params.get("id");
        var p = id ? getProduct(id) : PRODUCTS[0];
        if (!p) {
          detail.innerHTML = '<div class="empty-state"><p>We couldn\'t find that product — it may have been removed.</p>' +
            '<a class="btn btn-primary" href="shop.html">Back to shop</a></div>';
          return;
        }

        document.getElementById("page-title").textContent = p.name + " — Infinite Box";

        var specsHtml = Object.keys(p.specs).map(function (k) {
          return '<div class="pd-meta-row"><span>' + ibEscape(k) + '</span><span>' + ibEscape(p.specs[k]) + '</span></div>';
        }).join("");

        // Gallery: main image with prev/next arrows and a thumbnail strip when there is more
        // than one photo; falls back to the placeholder icon when there are none.
        var galleryHtml;
        if (p.images.length) {
          galleryHtml =
            '<div class="pd-gallery" id="pd-gallery">' +
              '<div class="pd-image">' +
                '<img id="pd-main" src="' + ibEscape(p.images[0]) + '" alt="' + ibEscape(p.name) + '">' +
                (p.images.length > 1
                  ? '<button type="button" class="pd-nav pd-prev" data-dir="-1" aria-label="Previous photo">‹</button>' +
                    '<button type="button" class="pd-nav pd-next" data-dir="1" aria-label="Next photo">›</button>' +
                    '<span class="pd-count" id="pd-count">1 / ' + p.images.length + '</span>'
                  : '') +
              '</div>' +
              (p.images.length > 1
                ? '<div class="pd-thumbs" role="tablist">' + p.images.map(function (src, i) {
                    return '<button type="button" class="pd-thumb' + (i === 0 ? ' is-active' : '') + '" data-index="' + i + '" role="tab" aria-selected="' + (i === 0) + '" aria-label="Photo ' + (i + 1) + '"><img src="' + ibEscape(src) + '" alt="" loading="lazy"></button>';
                  }).join('') + '</div>'
                : '') +
            '</div>';
        } else {
          galleryHtml = '<div class="pd-image">' + productThumbHTML(p) + '</div>';
        }

        detail.innerHTML =
          galleryHtml +
          '<div class="pd-info">' +
            '<p class="eyebrow">' + ibEscape(p.category) + '</p>' +
            '<h1>' + ibEscape(p.name) + '</h1>' +
            '<p class="pd-price">' + formatPrice(p.price) + '</p>' +
            '<p class="pd-desc">' + ibEscape(p.description) + '</p>' +
            '<div class="pd-meta">' + specsHtml + '</div>' +
            (p.soldOut
              ? '<div class="pd-actions"><span class="btn btn-outline pd-sold-out" aria-disabled="true">Sold out</span></div>' +
                '<p class="form-note">This item is currently out of stock. <a href="custom.html" style="text-decoration:underline;">Request a custom order</a> or check back soon.</p>'
              : '<div class="pd-actions">' +
                  '<div class="qty-input"><button type="button" data-qty="-1">−</button><input type="text" id="qty" value="1" readonly aria-label="Quantity"><button type="button" data-qty="1">+</button></div>' +
                  '<button class="btn btn-primary" id="add-to-cart-btn">Add to Cart</button>' +
                '</div>' +
                (p.stock <= 5 ? '<p class="form-note pd-low-stock">Only ' + p.stock + ' left in stock.</p>' : "") +
                '<p class="add-msg" id="add-msg">Added to cart.</p>') +
          '</div>';

        if (p.images.length > 1) {
          var current = 0;
          var mainImg = document.getElementById("pd-main");
          var countEl = document.getElementById("pd-count");
          var thumbs = document.querySelectorAll(".pd-thumb");
          var show = function (i) {
            current = (i + p.images.length) % p.images.length;
            mainImg.src = p.images[current];
            countEl.textContent = (current + 1) + " / " + p.images.length;
            thumbs.forEach(function (t, j) {
              t.classList.toggle("is-active", j === current);
              t.setAttribute("aria-selected", j === current);
            });
          };
          document.querySelectorAll(".pd-nav").forEach(function (b) {
            b.addEventListener("click", function () { show(current + parseInt(b.dataset.dir, 10)); });
          });
          thumbs.forEach(function (t) {
            t.addEventListener("click", function () { show(parseInt(t.dataset.index, 10)); });
          });
          document.addEventListener("keydown", function (e) {
            if (e.key === "ArrowLeft") show(current - 1);
            if (e.key === "ArrowRight") show(current + 1);
          });
          // Swipe on touch devices.
          var touchX = null;
          var gal = document.getElementById("pd-gallery");
          gal.addEventListener("touchstart", function (e) { touchX = e.touches[0].clientX; }, { passive: true });
          gal.addEventListener("touchend", function (e) {
            if (touchX === null) return;
            var dx = e.changedTouches[0].clientX - touchX;
            if (Math.abs(dx) > 40) show(current + (dx < 0 ? 1 : -1));
            touchX = null;
          });
        }

        var qtyInput = document.getElementById("qty");
        document.querySelectorAll("[data-qty]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            // Clamp to what is actually in stock (the cart and server enforce this too).
            var val = Math.min(p.stock, Math.max(1, parseInt(qtyInput.value, 10) + parseInt(btn.dataset.qty, 10)));
            qtyInput.value = val;
          });
        });

        var addBtn = document.getElementById("add-to-cart-btn");
        if (addBtn) addBtn.addEventListener("click", function () {
          IB.addToCart(p.id, parseInt(qtyInput.value, 10));
          var msg = document.getElementById("add-msg");
          msg.classList.add("show");
          setTimeout(function () { msg.classList.remove("show"); }, 2500);
        });

        var related = PRODUCTS.filter(function (x) { return x.id !== p.id; }).slice(0, 3);
        document.getElementById("related-grid").innerHTML = related.map(productCardHTML).join("");
      }).catch(function () {
        detail.innerHTML = loadErrorHTML("Couldn't load this product.");
      });
    }
    ibOnRetry(detail, load);
    load();
  })();
</script>
</body>
</html>
