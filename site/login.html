<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Infinite Box</title>
<meta name="description" content="Log in to your Infinite Box account to view orders and quotes.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/icon-dark.png">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div id="header-placeholder"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <p class="eyebrow">Account</p>
      <h1>Log in</h1>
      <p>Welcome back. Log in to track orders and custom quotes.</p>
    </div>
  </section>

  <section class="section" style="padding-top:48px;">
    <div class="container">
      <div class="auth-wrap">
        <button type="button" class="btn-google" id="google-login-btn" onclick="handleGoogleLogin()">
          <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.03l3.05-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.97l3.05 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
          <span>Continue with Google</span>
        </button>
        <div class="auth-divider"><span>or</span></div>
        <form class="form-grid" id="login-form" onsubmit="return handleLogin(event)">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" required autocomplete="current-password">
            <p class="form-note" style="margin:6px 0 0;"><a href="forgot-password.html">Forgot password?</a></p>
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="login-submit">Log in</button>
          <p class="form-note" id="login-error" style="display:none;color:hsl(var(--destructive));"></p>
        </form>
        <p class="auth-alt">Don't have an account? <a href="signup.html" id="signup-link">Create one</a></p>
      </div>
    </div>
  </section>
</main>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/partials.js"></script>
<script>
  function nextTarget() {
    var params = new URLSearchParams(location.search);
    var next = params.get("next");
    // Same-site pages only: "account.html" or "admin/orders.html" — never absolute/../ URLs.
    return (next && /^(admin\/)?[a-zA-Z0-9_-]+\.html$/.test(next)) ? next : "account.html";
  }

  // If already signed in, skip the form.
  IBAuth.getUser().then(function (user) { if (user) window.location.href = nextTarget(); });

  // Carry ?next= over to signup so a new customer lands back where they started (e.g. the cart).
  if (new URLSearchParams(location.search).get("next")) {
    document.getElementById("signup-link").href = "signup.html?next=" + encodeURIComponent(nextTarget());
  }

  async function handleGoogleLogin() {
    var btn = document.getElementById("google-login-btn");
    var errorEl = document.getElementById("login-error");
    errorEl.style.display = "none";
    btn.disabled = true;
    try {
      var res = await IBAuth.signInWithGoogle(nextTarget());
      if (res.error) throw res.error;
    } catch (err) {
      errorEl.textContent = err && err.message ? err.message : "Google sign-in failed. Please try again.";
      errorEl.style.display = "block";
      btn.disabled = false;
    }
  }

  async function handleLogin(e) {
    e.preventDefault();
    var btn = document.getElementById("login-submit");
    var errorEl = document.getElementById("login-error");
    errorEl.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Logging in…";
    try {
      var res = await IBAuth.signIn(
        document.getElementById("email").value,
        document.getElementById("password").value
      );
      if (res.error) throw res.error;
      window.location.href = nextTarget();
    } catch (err) {
      errorEl.textContent = err && err.message ? err.message : "Login failed. Check your details and try again.";
      errorEl.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Log in";
    }
    return false;
  }
</script>
</body>
</html>
