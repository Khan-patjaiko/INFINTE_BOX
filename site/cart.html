<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart — Infinite Box</title>
<meta name="description" content="Review the items in your Infinite Box cart and check out securely with Stripe.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/icon-dark.png">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div id="header-placeholder"></div>

<main>
  <section class="page-hero" style="padding-bottom:0;border-bottom:none;">
    <div class="container">
      <p class="eyebrow">Order</p>
      <h1>Your Cart</h1>
    </div>
  </section>

  <section class="section" style="padding-top:8px;">
    <div class="container" id="cart-container"></div>
  </section>
</main>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/partials.js"></script>
<script>
  (function () {
    var container = document.getElementById("cart-container");
    container.innerHTML = '<p class="grid-status">Loading your cart…</p>';

    async function startCheckout(btn) {
      var cart = IB.getCart();
      if (!cart.length) return;
      btn.disabled = true;
      btn.textContent = "Redirecting to secure checkout…";
      try {
        var res = await window.IBDB.functions.invoke("create-checkout-session", {
          body: { items: cart, origin: location.origin }
        });
        if (res.error) throw res.error;
        if (res.data && res.data.url) { window.location.href = res.data.url; return; }
        throw new Error("No checkout URL returned");
      } catch (e) {
        console.error("Checkout failed", e);
        // The Edge Function returns 409 with a readable message when stock ran out
        // between adding to cart and checking out; surface that instead of the generic text.
        var message = "Sorry, checkout couldn't start. Please try again.";
        var stockProblem = false;
        try {
          if (e && e.context && typeof e.context.json === "function") {
            var body = await e.context.json();
            if (body && body.error) { message = body.error; stockProblem = !!body.sold_out; }
          }
        } catch (ignore) {}
        btn.disabled = false;
        btn.textContent = "Checkout";
        if (stockProblem) {
          // Re-fetch products so the cart re-renders with current stock, then show the note.
          _productsPromise = null;
          await loadProducts();
          render();
        }
        var note = document.getElementById("checkout-error");
        if (note) { note.textContent = message; note.style.display = "block"; }
      }
    }

    function render() {
      var cart = IB.getCart();

      if (cart.length === 0) {
        container.innerHTML =
          '<div class="empty-state">' +
            '<p>Your cart is empty.</p>' +
            '<a class="btn btn-primary" href="shop.html">Browse Products</a>' +
          '</div>';
        return;
      }

      // Clamp quantities to stock and flag anything that can no longer be bought.
      var blocked = false;
      cart.forEach(function (item) {
        var p = getProduct(item.id);
        if (!p) return;
        if (p.soldOut) { blocked = true; }
        else if (item.qty > p.stock) { IB.setQty(p.id, p.stock); item.qty = p.stock; }
      });

      var rows = cart.map(function (item) {
        var p = getProduct(item.id);
        if (!p) return "";
        var stockNote = p.soldOut
          ? '<p class="cart-item-material cart-stock-warn">Sold out — remove this item to check out</p>'
          : (item.qty >= p.stock ? '<p class="cart-item-material cart-stock-warn">Only ' + p.stock + ' in stock</p>' : "");
        return '<div class="cart-row' + (p.soldOut ? " sold-out" : "") + '" data-id="' + ibEscape(p.id) + '">' +
          '<div class="cart-thumb">' + productThumbHTML(p) + '</div>' +
          '<div>' +
            '<p class="cart-item-name">' + ibEscape(p.name) + '</p>' +
            '<p class="cart-item-material">' + ibEscape(p.material) + ' · ' + formatPrice(p.price) + '</p>' + stockNote +
          '</div>' +
          '<div class="cart-item-actions">' +
            '<div class="qty-input"><button type="button" data-qty-down>−</button><input type="text" value="' + item.qty + '" readonly><button type="button" data-qty-up>+</button></div>' +
            '<p class="product-price">' + formatPrice(p.price * item.qty) + '</p>' +
            '<button class="cart-remove" data-remove>Remove</button>' +
          '</div>' +
        '</div>';
      }).join("");

      var subtotal = cart.reduce(function (sum, item) {
        var p = getProduct(item.id);
        return sum + (p && !p.soldOut ? p.price * item.qty : 0);
      }, 0);
      var shipping = subtotal > 0 ? shippingUsd : 0;
      var total = subtotal + shipping;

      container.innerHTML = rows +
        '<div class="cart-summary">' +
          '<div class="cart-summary-row"><span>Subtotal</span><span>' + formatPrice(subtotal) + '</span></div>' +
          '<div class="cart-summary-row"><span>Shipping</span><span>' + formatPrice(shipping) + '</span></div>' +
          '<div class="cart-summary-row total"><span>Total</span><span>' + formatPrice(total) + '</span></div>' +
          (blocked
            ? '<button class="btn btn-primary btn-block mt-16" id="checkout-btn" disabled title="Remove sold-out items first">Checkout</button>'
            : '<button class="btn btn-primary btn-block mt-16" id="checkout-btn">Checkout</button>') +
          '<a class="btn btn-outline btn-block mt-16" href="custom.html">Need a custom quote instead?</a>' +
          '<p class="form-note" id="checkout-error" style="display:none;color:hsl(var(--destructive));">Sorry, checkout couldn\'t start. Please try again.</p>' +
        '</div>';

      container.querySelectorAll(".cart-row").forEach(function (row) {
        var id = row.dataset.id;
        row.querySelector("[data-qty-up]").addEventListener("click", function () {
          var item = IB.getCart().find(function (i) { return i.id === id; });
          var p = getProduct(id);
          IB.setQty(id, Math.min(p ? p.stock : item.qty + 1, item.qty + 1));
          render();
        });
        row.querySelector("[data-qty-down]").addEventListener("click", function () {
          var item = IB.getCart().find(function (i) { return i.id === id; });
          IB.setQty(id, item.qty - 1);
          render();
        });
        row.querySelector("[data-remove]").addEventListener("click", function () {
          IB.removeFromCart(id);
          render();
        });
      });

      var checkoutBtn = document.getElementById("checkout-btn");
      if (checkoutBtn && !checkoutBtn.disabled) {
        checkoutBtn.addEventListener("click", function () { startCheckout(checkoutBtn); });
      }
    }

    // Flat shipping fee comes from store_settings (same row create-checkout-session uses);
    // fall back to $6.50 if the read fails so the cart still renders.
    var shippingUsd = 6.5;
    function loadShipping() {
      if (!window.IBDB) return Promise.resolve();
      return window.IBDB.from("store_settings").select("value").eq("key", "shipping_cents").maybeSingle()
        .then(function (res) {
          var cents = res && res.data && res.data.value;
          if (typeof cents === "number" && cents >= 0) shippingUsd = cents / 100;
        }, function () {});
    }

    function load() {
      container.innerHTML = '<p class="grid-status">Loading your cart…</p>';
      Promise.all([loadProducts(), loadShipping()]).then(render).catch(function () {
        container.innerHTML = loadErrorHTML("Couldn't load your cart.");
      });
    }
    ibOnRetry(container, load);
    load();
  })();
</script>
</body>
</html>
