<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart — Infinite Box</title>
<meta name="description" content="Review the items in your Infinite Box cart and check out securely with Stripe.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/icon-dark.png">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div id="header-placeholder"></div>

<main>
  <section class="page-hero" style="padding-bottom:0;border-bottom:none;">
    <div class="container">
      <p class="eyebrow">Order</p>
      <h1>Your Cart</h1>
    </div>
  </section>

  <section class="section" style="padding-top:8px;">
    <div class="container" id="cart-container"></div>
  </section>
</main>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/partials.js"></script>
<script>
  (function () {
    var container = document.getElementById("cart-container");
    container.innerHTML = '<p class="grid-status">Loading your cart…</p>';

    // Orders always belong to a customer account: no guest checkout. Send signed-out
    // shoppers to log in (or sign up) and bring them straight back here.
    var signedIn = false;
    function goLogin() { window.location.href = "login.html?next=cart.html"; }

    async function startCheckout(btn) {
      var cart = IB.getCart();
      if (!cart.length) return;
      if (!(await IBAuth.getUser())) return goLogin();
      btn.disabled = true;
      btn.textContent = "Redirecting to secure checkout…";
      try {
        var res = await window.IBDB.functions.invoke("create-checkout-session", {
          body: { items: cart, origin: location.origin }
        });
        if (res.error) {
          // Session expired between page load and click → server says 401.
          if (res.error.context && res.error.context.status === 401) return goLogin();
          throw res.error;
        }
        if (res.data && res.data.url) { window.location.href = res.data.url; return; }
        throw new Error("No checkout URL returned");
      } catch (e) {
        console.error("Checkout failed", e);
        // The Edge Function returns 409 with a readable message when stock ran out
        // between adding to cart and checking out; surface that instead of the generic text.
        var message = "Sorry, checkout couldn't start. Please try again.";
        var stockProblem = false;
        try {
          if (e && e.context && typeof e.context.json === "function") {
            var body = await e.context.json();
            if (body && body.error) { message = body.error; stockProblem = !!body.sold_out; }
          }
        } catch (ignore) {}
        btn.disabled = false;
        btn.textContent = "Checkout";
        if (stockProblem) {
          // Re-fetch products so the cart re-renders with current stock, then show the note.
          _productsPromise = null;
          await loadProducts();
          render();
        }
        var note = document.getElementById("checkout-error");
        if (note) { note.textContent = message; note.style.display = "block"; }
      }
    }

    function render() {
      var cart = IB.getCart();

      // Drop entries for products (or variants) that no longer exist (deleted or deactivated
      // in admin); otherwise the header badge keeps counting items the cart can't show.
      var known = cart.filter(function (item) { var p = getProduct(item.id); return !!p && lineInfo(p, item.options).exists; });
      if (known.length !== cart.length) {
        cart = known;
        IB.saveCart(cart);
      }

      if (cart.length === 0) {
        container.innerHTML =
          '<div class="empty-state">' +
            '<p>Your cart is empty.</p>' +
            '<a class="btn btn-primary" href="shop.html">Browse Products</a>' +
          '</div>';
        return;
      }

      // Clamp quantities to stock and flag anything that can no longer be bought.
      var blocked = false;
      cart.forEach(function (item) {
        var p = getProduct(item.id);
        if (!p) return;
        // Price and stock are per variant for products with variants (lineInfo in products.js).
        var info = lineInfo(p, item.options);
        if (info.stock <= 0) { blocked = true; }
        else if (item.qty > info.stock) { IB.setQty(IB.lineKey(item), info.stock); item.qty = info.stock; }
      });

      var rows = cart.map(function (item) {
        var p = getProduct(item.id);
        if (!p) return "";
        var info = lineInfo(p, item.options), soldOut = info.stock <= 0;
        var stockNote = soldOut
          ? '<p class="cart-item-material cart-stock-warn">Sold out — remove this item to check out</p>'
          : (item.qty >= info.stock ? '<p class="cart-item-material cart-stock-warn">Only ' + info.stock + ' in stock</p>' : "");
        var opts = item.options ? Object.keys(item.options).map(function (k) { return ibEscape(k) + ': ' + ibEscape(item.options[k]); }).join(' · ') : '';
        return '<div class="cart-row' + (soldOut ? " sold-out" : "") + '" data-key="' + ibEscape(IB.lineKey(item)) + '" data-id="' + ibEscape(p.id) + '">' +
          '<div class="cart-thumb">' + productThumbHTML(p) + '</div>' +
          '<div>' +
            '<p class="cart-item-name">' + ibEscape(p.name) + '</p>' +
            (opts ? '<p class="cart-item-options">' + opts + '</p>' : '') +
            '<p class="cart-item-material">' + ibEscape(p.material) + ' · ' + formatPrice(info.price) + '</p>' + stockNote +
          '</div>' +
          '<div class="cart-item-actions">' +
            '<div class="qty-input"><button type="button" data-qty-down>−</button><input type="text" value="' + item.qty + '" readonly aria-label="Quantity"><button type="button" data-qty-up>+</button></div>' +
            '<p class="product-price">' + formatPrice(info.price * item.qty) + '</p>' +
            '<button class="cart-remove" data-remove>Remove</button>' +
          '</div>' +
        '</div>';
      }).join("");

      var subtotal = cart.reduce(function (sum, item) {
        var p = getProduct(item.id);
        var info = p ? lineInfo(p, item.options) : null;
        return sum + (info && info.stock > 0 ? info.price * item.qty : 0);
      }, 0);
      var freeShipping = freeShippingFrom > 0 && subtotal >= freeShippingFrom;
      var shipping = subtotal > 0 && !freeShipping ? shippingBaht : 0;
      var total = subtotal + shipping;

      container.innerHTML = rows +
        '<div class="cart-summary">' +
          '<div class="cart-summary-row"><span>Subtotal</span><span>' + formatPrice(subtotal) + '</span></div>' +
          '<div class="cart-summary-row"><span>Shipping</span><span>' + (freeShipping ? 'Free' : formatPrice(shipping)) + '</span></div>' +
          (!freeShipping && freeShippingFrom > 0 && subtotal > 0 ? '<p class="cart-ship-note">Add ' + formatPrice(freeShippingFrom - subtotal) + ' more for free shipping.</p>' : '') +
          '<div class="cart-summary-row total"><span>Total</span><span>' + formatPrice(total) + '</span></div>' +
          (blocked
            ? '<button class="btn btn-primary btn-block mt-16" id="checkout-btn" disabled title="Remove sold-out items first">Checkout</button>'
            : '<button class="btn btn-primary btn-block mt-16" id="checkout-btn">' + (signedIn ? "Checkout" : "Log in to check out") + '</button>') +
          (signedIn ? '' : '<p class="form-note" style="margin:8px 0 0;text-align:center;">Orders are tied to your account so you can track them. New here? <a href="signup.html?next=cart.html">Create an account</a> — your cart will be waiting.</p>') +
          '<a class="btn btn-outline btn-block mt-16" href="custom.html">Need a custom quote instead?</a>' +
          '<p class="form-note" id="checkout-error" style="display:none;color:hsl(var(--destructive));">Sorry, checkout couldn\'t start. Please try again.</p>' +
        '</div>';

      container.querySelectorAll(".cart-row").forEach(function (row) {
        var id = row.dataset.id, key = row.dataset.key;
        var findLine = function () { return IB.getCart().find(function (i) { return IB.lineKey(i) === key; }); };
        row.querySelector("[data-qty-up]").addEventListener("click", function () {
          var item = findLine();
          var p = getProduct(id);
          IB.setQty(key, Math.min(p ? lineInfo(p, item.options).stock : item.qty + 1, item.qty + 1));
          render();
        });
        row.querySelector("[data-qty-down]").addEventListener("click", function () {
          var item = findLine();
          IB.setQty(key, item.qty - 1);
          render();
        });
        row.querySelector("[data-remove]").addEventListener("click", function () {
          IB.removeFromCart(key);
          render();
        });
      });

      var checkoutBtn = document.getElementById("checkout-btn");
      if (checkoutBtn && !checkoutBtn.disabled) {
        checkoutBtn.addEventListener("click", function () { startCheckout(checkoutBtn); });
      }
    }

    // Shipping comes from store_settings (same rows create-checkout-session uses):
    // flat shipping_cents, waived once the subtotal reaches free_shipping_threshold_cents.
    // Fallbacks (฿50, free from ฿800) keep the cart rendering if the read fails.
    var shippingBaht = 50;
    var freeShippingFrom = 800;
    function loadShipping() {
      if (!window.IBDB) return Promise.resolve();
      return window.IBDB.from("store_settings").select("key,value").in("key", ["shipping_cents", "free_shipping_threshold_cents"])
        .then(function (res) {
          (res && res.data || []).forEach(function (row) {
            if (typeof row.value !== "number" || row.value < 0) return;
            if (row.key === "shipping_cents") shippingBaht = row.value / 100;
            if (row.key === "free_shipping_threshold_cents") freeShippingFrom = row.value / 100;
          });
        }, function () {});
    }

    function load() {
      container.innerHTML = '<p class="grid-status">Loading your cart…</p>';
      var whoami = IBAuth.getUser().then(function (u) { signedIn = !!u; });
      Promise.all([loadProducts(), loadShipping(), whoami]).then(render).catch(function () {
        container.innerHTML = loadErrorHTML("Couldn't load your cart.");
      });
    }
    ibOnRetry(container, load);
    load();
  })();
</script>
</body>
</html>
